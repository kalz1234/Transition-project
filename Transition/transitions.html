<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transitions</title>
    <link rel="stylesheet" href="transitions.css"/>
</head>
<body>
    <div class="container">
        <header>
            <h1>CSS Transitions</h1>
            <div class="properties">
                <div class="group">
                    <label for="duration"> Duration (s): </label>
                    <input type="number" id="duration" min="0.1" max="3" step="0.1" value="0.5" />
                </div>

                <div class="group">
                    <label for="easing">Easing : </label>
                    <select id="easing">
                        <option value="ease">Ease</option>
                        <option value="ease-in">Ease In</option>
                        <option value="ease-out">Ease Out</option>
                        <option value="ease-in-out">Ease In Out</option>
                        <option value="linear">Linear</option>
                    </select>
                </div>
            </div>
        </header>

        <section>
            <div class="preview">
                <div class="block" id="block" >Transition</div>
            </div>

            <div class="transition-list">
                <button class="transition-btn fade">Fade</button>
                <button class="transition-btn slide-right">Slide Right</button>
                <button class="transition-btn slide-up">Slide Up</button>
                <button class="transition-btn rotate">Rotate</button>
                <button class="transition-btn scale">Scale</button>
                <button class="transition-btn color">Color Change</button>
                <button class="transition-btn shadow">Shadow</button>
                <button class="transition-btn skew">Skew</button>
            </div>
        </section>
    </div>


    <script src="transitions.js"></script>
</body>
</html>
